// User Preferences RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_preferences;

import "setting.proto";
import "settings_group.proto";
import "error.proto";
import "user.proto";

service UserPreferencesManagementService {
  // Initiates a request to modify settings of a specific service with the current user's profile.
  // Note:
  //   * The service that owns the settings ultimately determines if the change is accepted.
  //   * This function returns when the request is received, not when the change is applied.
  //   * Use the SubscribeToSettingsChangeAndGetSettings API to monitor actual setting changes.
  rpc RequestSettingsChange(RequestSettingsChangeRequest) returns (RequestSettingsChangeResponse) {}

  // Subscribes the caller to receive notifications when settings change, and immediately returns
  // the current settings. Requirements:
  //   * The caller must implement the UserPreferencesView interface, including the OnSettingsChange
  //   method (which will be called upon updates).
  rpc SubscribeToSettingsChangeAndGetSettings(SubscribeToSettingsChangeAndGetSettingsRequest)
      returns (SubscribeToSettingsChangeAndGetSettingsResponse) {}

  // Unregisters the caller for setting group change notifications.
  rpc UnsubscribeFromSettingsChange(UnsubscribeToSettingsChangeRequest)
      returns (UnsubscribeToSettingsChangeResponse) {}
}

message RequestSettingsChangeRequest {
  // The ID of the settings group to be modified.
  SettingsGroupId settings_group_id = 1;

  // The list of settings to update, with their desired new values.
  repeated Setting settings = 2;
}

message RequestSettingsChangeResponse {
  // Error message if request fails.
  Error error = 1;
}

message SubscribeToSettingsChangeAndGetSettingsRequest {
  // The ID of the settings group that a service wants to receive callbacks for
  // when it is updated.
  SettingsGroupId settings_group_id = 1;

  // Temporary parameter to expose the identity of the caller of the subscribe
  // API to the service. SDV Comms stack will expose the identity of callers of GRPC
  // to services in the future
  string caller_fqin = 2;
}

message SubscribeToSettingsChangeAndGetSettingsResponse {
  // Schema version of the provided settings
  string version = 1;

  // The current settings in the group, including any constraints.
  repeated SettingAndConstraints setting_and_constraints = 2;

  // Error message if request fails.
  Error error = 3;
}

message UnsubscribeToSettingsChangeRequest {
  // The ID of the settings group that a service wants to stop receiving callbacks for.
  SettingsGroupId settings_group_id = 1;

  // Temporary parameter to expose the identity of the caller of the subscribe
  // API to the service. SDV Comms stack will expose the identity of callers of GRPC
  // to services in the future
  string caller_fqin = 2;
}

message UnsubscribeToSettingsChangeResponse {
  // Error message if request fails.
  Error error = 1;
}
