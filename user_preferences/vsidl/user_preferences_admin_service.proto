// User Preferences RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.
//
// This API can be changed when update story, service discovery unit types, public error API, and
// ACLs are defined and CommStack API is finalized.

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.android.sdv.sdvgrpclibrary";
option java_outer_classname = "UserPreferencesAdminServiceProto";

package sdv.user_preferences;

import "settings_group.proto";
import "error.proto";
import "user.proto";

service UserPreferencesAdminService {
  // Creates a profile in which user preferences are stored.
  // Each setting within a profile is initialized with a default value.
  // The SelectUser API has to be used to designate the profile as the active one.
  // Returns an error if the profile already exists or could not be created.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}

  // Selects the active user and applies their settings. If a UserControllableService rejects
  // a change, the user's profile will be updated to match the current settings. Returns an
  // error if the profile does not exist or could not be loaded.
  rpc SelectUser(SelectUserRequest) returns (SelectUserResponse) {}

  // Deletes a profile.
  // Returns an error if the profile could not be deleted or does not exist.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // Deletes all users, resets all UserControllableService to the default settings and
  // switches to the guest profile.
  // Returns an error if the reset process failed.
  rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse) {}

  // Returns a list of users stored within User Preferences service.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  // Returns settings for a given User or an error if the user doesn't exist.
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse) {}
}

message CreateUserRequest {
  // The user that should be created.
  User user = 1;
}

message CreateUserResponse {
  // Error message if the profile could not be created.
  Error error = 1;
}

message SelectUserRequest {
  // The ID of the profile that should be loaded.
  int32 user_id = 1;
}

message SelectUserResponse {
  // Error message if request fails.
  Error error = 1;
}

message DeleteUserRequest {
  // The ID of the profile that should be deleted.
  int32 user_id = 1;
}

message DeleteUserResponse {
  // Error message if request fails.
  Error error = 1;
}

message FactoryResetRequest {}

message FactoryResetResponse {
  // Error message if request fails.
  Error error = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  // The list of users
  repeated User users = 1;
  // Error message if request fails.
  Error error = 2;
}

message GetUserSettingsRequest {
  // The ID of the profile that should be retrieved
  int32 user_id = 1;
}

message GetUserSettingsResponse {
  // The list of settings groups stored in a profile
  repeated SettingsGroup groups = 1;
  // Error message if request fails.
  Error error = 2;
}
