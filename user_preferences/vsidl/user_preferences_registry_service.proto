// The set of APIs available to SDV services that need to expose customizable settings to vehicle
// users.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_preferences;

import "setting.proto";
import "error.proto";

service UserPreferencesRegistryService {
  // Registers a new settings group for a user-controllable service, including default values.
  rpc RegisterSettings(RegisterSettingsRequest) returns (RegisterSettingsResponse) {}

  // Updates the value of existing  settings within a specified group for a user-controllable
  // service.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse) {}
}

message RegisterSettingsRequest {
  // The name of the settings group to create.
  string group_name = 1;

  // Schema version for the settings.
  string version = 2;

  // Definitions of the settings within the group.
  repeated SettingDefinition settings_definitions = 3;
}

message RegisterSettingsResponse {
  // Error message if request fails.
  Error error = 1;
}

message UpdateSettingsRequest {
  // The name of the settings group that needs to be updated.
  // The settings group is stored within a namespace which is automatically
  // defined for each UserControllableService therefore the name does not need to be globally
  // unique.
  string group_name = 1;

  // Optional field.
  // Whenever a setting has been changed due to a request from the User Profile service, the
  // original transaction_id should be included. This allows the User Profile service to map
  // incoming changes to the original requests.
  uint64 transaction_id = 2;

  // The list of keys to update along with their respective values.
  repeated Setting settings = 3;
}

message UpdateSettingsResponse {
  // Error message if request fails.
  Error error = 1;
}