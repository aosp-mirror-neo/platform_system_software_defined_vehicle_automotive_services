// User Preferences RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.android.sdv.sdvgrpclibrary";
option java_outer_classname = "UserPreferencesAdminServiceProto";

package com.android.sdv.user_preferences;

import "settings_group.proto";
import "user.proto";

service UserPreferencesAdminService {
  // Creates a user in which user preferences are stored.
  // Each setting within a user is initialized with a default value.
  // The SelectUser API has to be used to designate the user as the active one.
  // Returns an error if the user already exists or could not be created.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}

  // Selects the active user and applies their settings. If a UserControllableService rejects
  // a change, the user's persisted settings will be updated to match the current settings. Returns
  // an error if the user does not exist or could not be loaded.
  rpc SelectUser(SelectUserRequest) returns (SelectUserResponse) {}

  // Deletes a user.
  // Returns an error if the deletion of the user fails.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // Deletes all users, resets all UserControllableService to the default settings.
  // Returns an error if the reset process failed.
  rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse) {}

  // Returns a list of users stored within User Preferences service.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  // Returns settings for a given User or an error if the user doesn't exist.
  rpc GetUserSettings(GetUserSettingsRequest) returns (GetUserSettingsResponse) {}
}

message CreateUserRequest {
  // Required.
  // The user that should be created.
  User user = 1;
}

message CreateUserResponse {}

message SelectUserRequest {
  // Required.
  // The ID of the user that should be loaded.
  int32 user_id = 1;
}

message SelectUserResponse {}

message DeleteUserRequest {
  // Required.
  // The ID of the user that should be deleted.
  int32 user_id = 1;
}

message DeleteUserResponse {}

message FactoryResetRequest {}

message FactoryResetResponse {}

message ListUsersRequest {}

message ListUsersResponse {
  // Required.
  // The list of users
  repeated User users = 1;
}

message GetUserSettingsRequest {
  // Required.
  // The ID of the user that should be retrieved
  int32 user_id = 1;
}

message GetUserSettingsResponse {
  // Required.
  // The list of settings groups stored in a user
  repeated SettingsGroup groups = 1;
}
