// The set of APIs that services must implement to be notified of settings change.

syntax = "proto3";

package com.sdv.google.user_preferences.view;
import "settings_group.proto";
import "setting.proto";

option java_multiple_files = true;
option java_package = "com.android.sdv.sdvgrpclibrary";
option java_outer_classname = "ChangeNotifierProto";

// Interface for receiving notifications about changes to user settings.
// Services that want to react to these changes must implement this interface.
service ChangeNotifier {
  // Notifies a service of settings change.
  rpc OnSettingsChange(OnSettingsChangeRequest) returns (OnSettingsChangeResponse) {}
}

message OnSettingsChangeRequest {
  // Required.
  SettingsGroupId settings_group_id = 1;

  // Required.
  // Settings currently applied
  repeated Setting active_settings = 2;

  // Required.
  // Setting changes that will be attempted when possible
  repeated Setting pending_changes = 3;

  // Required.
  // Changes to the user's persisted settings
  repeated Setting persisted_settings = 4;
}

message OnSettingsChangeResponse {}