// It is unstable until API council approval.

syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.android.sdv.sdvgrpclibrary";
option java_outer_classname = "ErrorProto";

package sdv.user_preferences;

enum ResponseCode {
  SUCCESS = 0x00;
  INTERNAL_ERROR = 0x01;
  NOT_FOUND_ERROR = 0x02;
  ACCESS_DENIED = 0x05;
  INVALID_REQUEST = 0x06;
  RUNTIME_ERROR = 0x07;
  ALREADY_EXISTS = 0x08;
}

message Error {
  ResponseCode error_code = 1;
  string message = 2;
}