// Error messages for User Preferences.
//
// NOTE: The response codes will be removed when the Public Error API is integrated.

syntax = "proto3";
package sdv.user_preferences;

enum ResponseCode {
  SUCCESS = 0x00;
  INTERNAL_ERROR = 0x01;
  NOT_FOUND_ERROR = 0x02;
  ACCESS_DENIED = 0x05;
  INVALID_REQUEST = 0x06;
  RUNTIME_ERROR = 0x07;
  ALREADY_EXISTS = 0x08;
}

message Error {
  ResponseCode error_code = 1;
  string message = 2;
}
