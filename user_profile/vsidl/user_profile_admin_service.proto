// User Profile RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_profile;

import "configuration.proto";
import "setting.proto";
import "error.proto";
import "user.proto";

service UserProfileAdminService {
  // Creates a profile in which user preferences are stored.
  // Each configuration within a profile is initialized with default values unless
  // it is provided within the create user request.
  // The SelectUser API has to be used to designate the profile as the active one.
  // Returns an error if the profile already exists or could not be created.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {}

  // Selects the active user and applies their configuration. If a UserControllableService rejects a
  // change, the user's profile will be updated to match the current configuration.
  // Returns an error if the profile does not exist or could not be loaded.
  rpc SelectUser(SelectUserRequest) returns (SelectUserResponse) {}

  // Deletes a profile.
  // Returns an error if the profile could not be deleted or does not exist.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {}

  // Deletes all user profiles, resets all UserControllableService to the default settings and
  // switches to the guest profile.
  // Returns an error if the reset process failed.
  rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse) {}

  // Returns a list of users stored within the User Profile.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  // Returns configuration for given user profile or an error if the profile doesn't exist.
  rpc GetUserConfigs(GetUserConfigsRequest) returns (GetUserConfigsResponse) {}
}

message CreateUserRequest {
  // The user that should be created.
  User user = 1;
}

message CreateUserResponse {
  // Error message if the profile could not be created.
  Error error = 1;
}

message SelectUserRequest {
  // The ID of the profile that should be loaded.
  uint64 user_id = 1;
}

message SelectUserResponse {
  // Error message if request fails.
  Error error = 1;
}

message DeleteUserRequest {
  // The ID of the profile that should be deleted.
  uint64 user_id = 1;
}

message DeleteUserResponse {
  // Error message if request fails.
  Error error = 1;
}

message FactoryResetRequest {}

message FactoryResetResponse {
  // Error message if request fails.
  Error error = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  // The list of users
  repeated User users = 1;
  // Error message if request fails.
  Error error = 2;
}

message GetUserConfigsRequest {
  // The ID of the profile that should be retrieved
  uint64 user_id = 1;
}

message GetUserConfigsResponse {
  // The list of configurations stored in a profile
  repeated Configuration configs = 1;
  // Error message if request fails.
  Error error = 2;
}
