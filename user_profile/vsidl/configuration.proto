syntax = "proto3";

package sdv.user_profile;

import "setting.proto";

message Configuration {
  // A unique name for this configuration
  string config_name = 1;

  // The version number of schema used by this configuration.
  string version = 2;

  // The list of settings which the configuration consists of.
  repeated Setting settings = 3;
}