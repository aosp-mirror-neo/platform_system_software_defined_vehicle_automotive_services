// APIs that must be implemented by services that contain user customizable settings.
//
// This is a PoC version for the API for the discussions.
// It is unstable until API council approval.

syntax = "proto3";

package sdv.user_profile.user_controllable;

import "setting.proto";
import "error.proto";

service UserControllableService {
  // Submits a request to update settings with the provided values. The method returns successfully
  // while the change is dome asynchronously. The service will notify the UserProfileRegistryService
  // of the actual setting values via the UpdateSettings API after the changes are applied or
  // rejected.
  rpc RequestSettingsChange(RequestSettingsChangeRequest) returns (RequestSettingsChangeResponse) {}

  // Resets the service to its default settings.
  // The service will notify the UserProfileRegistryService of the actual setting
  // values via the UpdateSettings API after the changes are applied.
  rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse) {}
}

message RequestSettingsChangeRequest {
  // The name of the settings group that needs to be updated.
  string group_name = 1;

  // A unique id for this change request.
  // Once the change is made, the transaction_id should be used in UpdateSettings sent to
  // UserProfileRegistryService
  uint64 transaction_id = 2;

  // The list of settings along with the new values they should be set too.
  repeated Setting settings = 3;
}

message RequestSettingsChangeResponse {
  // Error message if request fails.
  Error error = 1;
}

message FactoryResetRequest {}

message FactoryResetResponse {
  // Error message if request fails.
  Error error = 1;
}