// The set of APIs available to SDV services that need to expose customizable settings to vehicle
// users.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_profile;

import "setting.proto";
import "error.proto";

service UserProfileRegistryService {
  // Registers the config of user controllable services along with their default values.
  rpc RegisterConfig(RegisterConfigRequest) returns (RegisterConfigResponse) {}

  // Updates the set of settings within the selected configuration.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {}
}

message RegisterConfigRequest {
  // The name of the configuration.
  string config_name = 1;

  // The version number of the configuration.
  string version = 2;

  // The list of settings which the configuration consists of.
  repeated SettingDefinition settings_definitions = 3;
}

message RegisterConfigResponse {
  // Error message if request fails.
  Error error = 1;
}

message UpdateConfigRequest {
  // The name of the configuration that needs to be updated.
  // The configuration is stored within a namespace which is automatically
  // defined for each UserControllableService therefore the name does not need to be globally
  // unique.
  string config_name = 1;

  // Optional field.
  // Whenever a configuration has been changed due to a request from the User Profile service, the
  // original transaction_id should be included. This allows the User Profile service to map
  // incoming changes to the original requests.
  uint64 transaction_id = 2;

  // The list of keys to update along with their respective values.
  repeated Setting settings = 3;
}

message UpdateConfigResponse {
  // Error message if request fails.
  Error error = 1;
}