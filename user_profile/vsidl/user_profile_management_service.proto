// User Profile RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_profile;

import "setting.proto";
import "error.proto";
import "user.proto";

service UserProfileManagementService {
  // Requests the change in the current user profile for the given service.
  // There are no guarantees that the changes will be applied since services owning the
  // settings may reject the request. The request returns once the request has been received as
  // opposed to once the change has been made. The SubscribeToSettingsChangeAndGetSettings API can
  // be used to listen to setting changes.
  rpc RequestSettingsChange(RequestSettingsChangeRequest) returns (RequestSettingsChangeResponse) {}

  // Registers the caller for setting update notifications and returns the settings.
  // The caller must implement an interface UserProfileView containing a method OnSettingsChange.
  rpc SubscribeToSettingsChangeAndGetSettings(SubscribeToSettingsChangeAndGetSettingsRequest)
      returns (SubscribeToSettingsChangeAndGetSettingsResponse) {}

  // Unregisters the caller for setting group change notifications.
  rpc UnsubscribeFromSettingsChange(UnsubscribeToSettingsChangeRequest)
      returns (UnsubscribeToSettingsChangeResponse) {}
}

message RequestSettingsChangeRequest {
  // The name of the settings group that needs to be updated.
  string group_name = 1;

  // The list of settings along with the new values they should be set too
  repeated Setting settings = 2;
}

message RequestSettingsChangeResponse {
  // Error message if request fails.
  Error error = 1;
}

message SubscribeToSettingsChangeAndGetSettingsRequest {
  // The name of the settings group that a service wants to receive callbacks for
  // when it is updated.
  string group_name = 1;

  // Temporary parameter to expose the identity of the caller of the subscribe
  // API to the service. SDV Comms stack will expose the identity of callers of GRPC
  // to services in the future
  string service_bundle_name = 2;
}

message SubscribeToSettingsChangeAndGetSettingsResponse {
  // The version number of schema used by the settings.
  string version = 1;

  // The list of settings along with their current values
  repeated SettingAndConstraints setting_and_constraints = 2;

  // Error message if request fails.
  Error error = 3;
}

message UnsubscribeToSettingsChangeRequest {
  // The name of the settings group that a service wants to stop receiving callbacks for.
  string group_name = 1;

  // Temporary parameter to expose the identity of the caller of the subscribe
  // API to the service. SDV Comms stack will expose the identity of callers of GRPC
  // to services in the future
  string service_bundle_name = 2;
}

message UnsubscribeToSettingsChangeResponse {
  // Error message if request fails.
  Error error = 1;
}
