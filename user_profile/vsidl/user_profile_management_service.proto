// User Profile RPC APIs available to SDV services
//
// Allows SDV-Services to manage user configurable settings on per vehicle user basis.
//
// These APIs are experimental at this point.

syntax = "proto3";

package sdv.user_profile;

import "configuration.proto";
import "setting.proto";
import "error.proto";
import "user.proto";

service UserProfileManagementService {
  // Returns a list of users stored within the User Profile.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {}

  // Returns configuration for given user profile or an error if the profile doesn't exist.
  rpc GetUserConfigs(GetUserConfigsRequest) returns (GetUserConfigsResponse) {}

  // Selects the active user and applies their configuration. If a UserControllableService rejects a
  // change, the user's profile will be updated to match the current configuration.
  // Returns an error if the profile does not exist or could not be loaded.
  rpc SelectUser(SelectUserRequest) returns (SelectUserResponse) {}

  // Requests the change in the current user profile for the given service.
  // There are no guarantees that the changes will be applied since services owning the
  // settings may reject the request. The request returns once the request has been received as
  // opposed to once the change has been made. The SubscribeToConfigChange API can be used
  // to listen to request rejections or changes to configuration.
  rpc RequestConfigChange(RequestConfigChangeRequest) returns (RequestConfigChangeResponse) {}

  // Registers the caller for configuration update notifications.
  // The caller must implement an interface ConfigSubscriber containing a method OnConfigChange.
  rpc SubscribeToConfigChange(SubscribeToConfigChangeRequest)
      returns (SubscribeToConfigChangeResponse) {}
}

message SelectUserRequest {
  // The ID of the profile that should be loaded.
  uint64 user_id = 1;
}

message SelectUserResponse {
  // Error message if request fails.
  Error error = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  // The list of users
  repeated User users = 1;
  // Error message if request fails.
  Error error = 2;
}

message GetUserConfigsRequest {
  // The ID of the profile that should be retrieved
  uint64 user_id = 1;
}

message GetUserConfigsResponse {
  // The list of configurations stored in a profile
  repeated Configuration configs = 1;
  // Error message if request fails.
  Error error = 2;
}

message RequestConfigChangeRequest {
  // The name of the configuration that needs to be updated
  string config_name = 1;

  // The list of settings along with the new values they should be set too
  repeated Setting settings = 2;
}

message RequestConfigChangeResponse {
  // Error message if request fails.
  Error error = 1;
}

message SubscribeToConfigChangeRequest {
  // The name of the configuration that a service wants to receive callbacks for
  // when it is updated.
  string config_name = 1;
}

message SubscribeToConfigChangeResponse {
  // The current value of the configuration which a service has subscribed too.
  Configuration config = 1;

  // Error message if request fails.
  Error error = 2;
}
