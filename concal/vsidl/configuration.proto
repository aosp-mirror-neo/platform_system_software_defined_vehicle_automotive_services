syntax = "proto3";

package sdv.concal;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";

message ConfigMetadata {
  // Proto types and their dependencies.
  google.protobuf.FileDescriptorSet descriptor_set = 1;

  // The default config and its type, encoded as an Any message.
  google.protobuf.Any default_config = 2;
}

// Key-value pair to update configuration.
message ConfigOverrideKeyValue {
  // Required.
  // The name of the key (configuration parameter).
  // If the key is empty, the complete config is changed.
  string key = 1;

  // New value in the TextProto format.
  // To change the value completely, all its fields should be redefined.
  // Defined values will be merged into existing default value for the key.
  string value_txtproto = 2;
}

// Unique identifier for the config.
message ConfigId {
  // The FQIN of the service bundle that owns the configuration.
  string service_fqin = 1;

  // The name of the config.
  string config_name = 2;
}

message ConfigOverride {
  // Override identifier defined by the caller.
  // Unique per caller.
  string override_id = 1;

  // Unique config identifier.
  ConfigId config_id = 2;

  // Key-value pairs for keys to be updated in the config.
  repeated ConfigOverrideKeyValue pairs = 3;
}