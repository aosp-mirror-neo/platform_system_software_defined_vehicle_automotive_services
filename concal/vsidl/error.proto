// Error messages for ConCal.

syntax = "proto3";

package sdv.concal;

// ConCal response codes.
enum ResponseCode {
  SUCCESS = 0x00;
  INTERNAL_ERROR = 0x01;
  NOT_FOUND_ERROR = 0x02;
  MULTIPLE_CONFIGS = 0x03;
  SESSION_IN_PROGRESS = 0x04;
  ACCESS_DENIED = 0x05;
  INVALID_REQUEST = 0x06;
  RUNTIME_ERROR = 0x07;
}

// ConCal error message returned by ConCal with each response.
message Error {
  ResponseCode error_code = 1;

  // Error message.
  string message = 2;
}