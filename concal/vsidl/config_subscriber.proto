// Interface for SDV services which want to get notified about changes to a specific config, before
// the config change becomes active.
//
// This is a PoC version for the API for the discussions.
// It is unstable until API council approval.

syntax = "proto3";

package sdv.concal;

import "configuration.proto";
import "google/protobuf/descriptor.proto";

service ConfigSubscriberService {
  // Service which subscribes to ConCal to receive updates on a specific-config change before the
  // update becomes active.

  // ConCal provides a new version of the config with its schema.
  // Returns an error if the config cannot be deserialized.
  rpc OnConfigUpdate(OnConfigUpdateRequest) returns (OnConfigUpdateResponse) {}
}

message OnConfigUpdateRequest {
  // Unique config identifier.
  ConfigId config_id = 1;

  // Serialized config.
  bytes config = 2;

  // Config schema as proto types and their dependencies.
  google.protobuf.FileDescriptorSet descriptor_set = 3;

  // Version identifier for the config.
  string config_version = 4;
}

message OnConfigUpdateResponse {}
