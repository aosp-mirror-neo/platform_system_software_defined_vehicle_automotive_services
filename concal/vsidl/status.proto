// Status messages for ConCal.
// NOTE: The response codes will be removed when the Public Error API is integrated.

syntax = "proto3";

package sdv.concal;

// ConCal response codes.
// Please, plan to adjust status codes after the CommStack API provides SDV guidelines on error
// reporting.
enum ResponseCode {
  OK = 0;
  CANCELLED = 1;
  UNKNOWN = 2;
  INVALID_ARGUMENT = 3;
  DEADLINE_EXCEEDED = 4;
  NOT_FOUND = 5;
  ALREADY_EXISTS = 6;
  PERMISSION_DENIED = 7;
  RESOURCE_EXHAUSTED = 8;
  FAILED_PRECONDITION = 9;
  ABORTED = 10;
  OUT_OF_RANGE = 11;
  UNIMPLEMENTED = 12;
  INTERNAL = 13;
  UNAVAILABLE = 14;
  DATA_LOSS = 15;
  UNAUTHENTICATED = 16;
}

// ConCal status message returned by ConCal with each response.
message Status {
  ResponseCode code = 1;

  // Message.
  string message = 2;
}