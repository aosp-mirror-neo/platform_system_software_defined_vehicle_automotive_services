// Status messages for ConCal.
// NOTE: The response codes will be removed when the Public Error API is integrated.

syntax = "proto3";

package sdv.concal;

// ConCal response codes.
// Please, plan to adjust status codes after the CommStack API provides SDV guidelines on error
// reporting.
enum ResponseCode {
  SUCCESS = 0x00;
  INTERNAL_ERROR = 0x01;
  NOT_FOUND_ERROR = 0x02;
  MULTIPLE_CONFIGS = 0x03;
  SESSION_IN_PROGRESS = 0x04;
  ACCESS_DENIED = 0x05;
  INVALID_REQUEST = 0x06;
  RUNTIME_ERROR = 0x07;
}

// ConCal status message returned by ConCal with each response.
message Status {
  ResponseCode code = 1;

  // Message.
  string message = 2;
}