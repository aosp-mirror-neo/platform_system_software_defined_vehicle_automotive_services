// Interface for SDV services which want their configs to be calibrated.
//
// This is a PoC version for the API for the discussions.
// It is unstable until API council approval.

syntax = "proto3";

package sdv.concal;

import "configuration.proto";
import "calibration.proto";

service CalibratableService {
  // Service which participates in the calibration for a specific calibration config,
  // i.e. the same service can get multiple sequential calibration requests for the same config
  // and multiple configs can be calibrated in parallel.

  // ConCal delivers a new version of the calibration config.
  // The calibratable service stores a copy of its current calibration config.
  // Returns an error if a calibration config is not known.
  rpc StartCalibration(StartCalibrationRequest) returns (StartCalibrationResponse) {}

  // Update a calibration config.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {}

  // Service should reset its calibration config to the original values when the calibration stops.
  rpc FinishCalibration(FinishCalibrationRequest) returns (FinishCalibrationResponse) {}
}

message UpdateConfigRequest {
  // Unique config identifier, which has to be calibrated.
  ConfigId config_id = 1;

  // New calibration values in the form of a serialized calibration config.
  bytes config = 2;
}

message UpdateConfigResponse {}

message FinishCalibrationRequest {
  // Unique config identifier, whose calibration has to be finished.
  ConfigId config_id = 1;
}

message FinishCalibrationResponse {
  // Unique config identifier, whose calibration finished.
  ConfigId config_id = 1;

  // The last used calibration values.
  bytes config = 2;
}