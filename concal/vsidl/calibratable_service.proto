syntax = "proto3";

package sdv.concal.calib;

import "configuration.proto";
import "status.proto";

// Interface for SDV service bundles which want their configs to be calibrated.
// The same CalibratableService can get multiple sequential calibration requests for the same config
// and multiple configs can be calibrated in parallel.
// Only ConCal can use this API.
service CalibratableService {
  // Creates a new calibration session, in which a calibrated config is temporarily changed as long
  // as the session is open. Returns an error if a calibration config
  // is not known.
  rpc StartCalibration(StartCalibrationRequest) returns (StartCalibrationResponse) {}

  // Updates a calibration config. New calibration values are stored in memory.
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {}

  // Marks the end of the calibration session and reverts the calibrated config to its values prior
  // to the calibration session.
  rpc FinishCalibration(FinishCalibrationRequest) returns (FinishCalibrationResponse) {}
}

message StartCalibrationRequest {
  // Unique config identifier.
  ConfigId config_id = 1;
}

message StartCalibrationResponse {
  // Status message if request fails.
  Status status = 1;
}

message UpdateConfigRequest {
  // Unique config identifier, which has to be calibrated.
  ConfigId config_id = 1;

  // New calibration values in the form of a serialized calibration config.
  bytes config = 2;
}

message UpdateConfigResponse {}

message FinishCalibrationRequest {
  // Unique config identifier, whose calibration has to be finished.
  ConfigId config_id = 1;
}

message FinishCalibrationResponse {
  // Status message if request fails.
  // In case of failure, other message values are either not set or their correctness is not
  // guaranteed.
  Status status = 1;

  // The last used calibration values, if the status is successful.
  bytes config = 2;
}
