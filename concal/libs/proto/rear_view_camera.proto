syntax = "proto3";

package android.sdv.demo.config;

message RearViewCamera {
  string model = 1;
  uint64 horizontal_resolution = 2;
  uint64 vertical_resolution = 3;
  float x_axis_field_of_view = 4;
  float y_axis_field_of_view = 5;
  bool is_rgb = 6;
}
