// Definitions of data items structures used in the sampel.
// For now these definitions are available to both data item provider and diagnostics
// manager. This allows DM to retrieve data item message descriptor.
// Long-term DM will have a runtime way to get message descriptor, allowing changing the
// message without recompiling DM.

syntax = "proto3";

package sdv.sample.diagnostics;

import "syntax/vsidl.proto";
import "syntax/diagnostics.proto";

message DataItemOne {
  int32 code = 1 [(sdv.vsidl.primitive_byte_size) = ONE];
  bool enabled = 2;
  string name = 3 [(sdv.vsidl.variable_type_max_size) = 5];
}

message DataItemTwo {
  repeated int32 array = 1 [(sdv.vsidl.repeated_field_max_count) = 3];
}

message IoControllableData {}

message RoutineRequestParameter {
  string value = 1 [(sdv.vsidl.variable_type_max_size) = 10];
}

message RoutineResponseParameter {
  string echo = 1 [(sdv.vsidl.variable_type_max_size) = 20];
}

message FirstEventExt {
  int32 status = 1;
}

message SecondEventExt {
  string status = 1 [(sdv.vsidl.variable_type_max_size) = 10];
}

message LowPressureEventExt {}
