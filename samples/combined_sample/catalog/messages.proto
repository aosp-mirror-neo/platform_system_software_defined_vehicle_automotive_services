syntax = "proto3";

package com.sdv.google.sample.combined;

import "sdv/vsidl/v1/annotations.proto";
import "sdv/diagnostics/v1/diagnostics.proto";
import "configuration.proto";
import "user.proto";
import "vpm_notifications.proto";
import "event.proto";
import "update_state.proto";
import "local_custom_modes.proto";
import "health_config.proto";

message LowPressureData {
  int32 status = 1;
}

message Pressure {
  float value = 1 [(.sdv.diagnostics.v1.skip_for_diag) = true];
}

message OverheatingData {
  string status = 1 [(.sdv.vsidl.v1.variable_type_max_size) = 10];
}

message ConcalUsage {
  .com.sdv.google.concal.ConfigId id = 1;
}

message VpmUsage {
  .com.sdv.google.vpm.client.PowerStateNotificationRequest request = 1;
}

message DiagUsage {
  .com.sdv.google.diagnostics.event.Event event = 1;
}

message UserPreferencesUsage {
  .com.sdv.google.user_preferences.User user = 1;
}

message UpdateUsage {
  .com.sdv.google.update_manager.UpdateState state = 1;
}

message OrchUsage {
  .com.sdv.google.orchestrator.SetCustomStateRequest request = 1;
}

message HealthUsage {
  .com.sdv.google.health.HealthConfiguration configuration = 1;
}
