 * Unstable until API council approval.
 */

syntax = "proto3";
import "syntax/vsidl.proto";
package sdv.vpm.vehicle;

// Note : this is not the final set of states of the vehicle state machine.
// Allowed vehicle states in the vehicle and in the SDV VM.
enum VpmVehicleState {
  VEHICLE_STATE_UNSPECIFIED = 0;
  LOW_POWER = 1;
  SOFTWARE_UPDATE = 2;
  PARK = 3;
  LIFE_ON_BOARD = 4;
  VEHICLE_ON = 5;
  TRACTION_ON = 6;
}

// Client facing reprensentation of the vehicle state exposed via PUB/SUB API using Data Tunnel.
message VehicleStateChange {
  option (sdv.vsidl.topic) = {
    model: SINGLE_PUB
    unique: true
  };

  // Inidcates the current state of the vehicle.
  VpmVehicleState vehicle_state = 1;
}
