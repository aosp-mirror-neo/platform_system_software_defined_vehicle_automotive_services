syntax = "proto3";

package sdv.diagnostics.io_control;

import "response_code.proto";

// Diagnostics interface for InputOutputControlByIdentifier (UDS 0x2F) service.
//
// See ISO 14229-1:2020, section 13.2.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 13.2.4.
service IoControlService {
  // Request that indicates that the client no longer has control of the input signals,
  // internal parameters and/or output signals referenced by the identifier.
  rpc ReturnControlToEcu(IoControlRequest) returns (IoControlResponse) {}

  // Request to reset the input signals, internal parameters and/or output signals
  // referenced by the identifier to its default state.
  rpc ResetToDefault(IoControlRequest) returns (IoControlResponse) {}

  // Request to freeze the current state of the input signals, internal parameters and/or
  // output signals referenced by the identifier.
  rpc FreezeCurrentState(IoControlRequest) returns (IoControlResponse) {}

  // Request to adjust the current state of the input signals, internal parameters and/or
  // output signals referenced by the identifier in RAM to the values included in the
  // request.
  rpc PerformShortTermAdjustment(PerformShortTermAdjustmentRequest) returns (IoControlResponse) {}
}

message IoControlRequest {
  // Identifier for input signals, internal parameters and/or output signals.
  string id = 1;

  // In case identifier references more than one parameter, specifies which of the
  // referenced parameters are affected.
  bytes mask = 2;
}

message PerformShortTermAdjustmentRequest {
  // Identifier for input signals, internal parameters and/or output signals.
  string id = 1;

  // Adjusted state of controls referenced by the identifier.
  bytes adjusted_value = 2;

  // In case identifier references more than one parameter, specifies which of the
  // referenced parameters are affected.
  bytes mask = 3;
}

message IoControlResponse {
  // State of contols referenced by the identifier provided in request.
  bytes value = 1;

  // Response code.
  ResponseCode response_code = 2;
}
