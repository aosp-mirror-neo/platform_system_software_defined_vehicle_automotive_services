syntax = "proto3";

package sdv.diagnostics.ecu_reset;

import "connection.proto";
import "negative_response_code.proto";
import "syntax/diagnostics.proto";

// Diagnostic interface for ECUReset (UDS 0x11) service.
//
// See ISO 14229-1:2020, section 10.3.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 10.3.4.
service ECUReset {
  // Perform "hard reset", which simulates the power-on/start-up sequence.
  rpc HardReset(connection.ConnectionId) returns (nrc.EmptyResponse) {}

  // Perform reset similar to the driver turning the ignition key off and back on.
  rpc KeyOnOffReset(connection.ConnectionId) returns (nrc.EmptyResponse) {}

  // Perform "soft reset", which causes the server to immediately restart the application
  // program if applicable.
  rpc SoftReset(connection.ConnectionId) returns (nrc.EmptyResponse) {}

  // Performs shutdown to a sleep mode rather that a power off.
  //
  // Applies to ECUs which a not ignition powered but battery powered only.
  rpc EnableRapidPowerShutdown(connection.ConnectionId) returns (RapidPowerShutdownResponse) {}

  // Request to disable the previously enabled "rapid power shutdown".
  rpc DisableRapidPowerShutdown(connection.ConnectionId) returns (nrc.EmptyResponse) {}

  // Perform vehicle manufacturer / system supplier specific ECU reset.
  rpc CustomReset(CustomResetRequest) returns (nrc.EmptyResponse) {}
}

message CustomResetRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // Type of the ECU reset to be performed.
  //
  // Valid values:
  //  - 0x40 to 0x5F: vehicle manufacturer specific reset;
  //  - 0x60 to 0x75: system supplier specific reset.
  int32 reset_type = 2 [(sdv.vsidl.primitive_byte_size) = ONE];
}

message RapidPowerShutdownResponse {
  // The minimum time of the stand-by sequence the server will remain in the power down.
  //
  // The resolution of this parameter is one second per count.
  // 0x00 to 0xFE: 0 to 254 seconds power down time.
  // 0xFF: indicates a failure or time not available.
  int32 powerDownTime = 1;

  // Error code.
  //
  // If set to a value other than "POSITIVE_RESPONSE" indicates an error handling the request.
  // Other parts of response should be ignored in such case.
  nrc.NegativeResponseCode error_code = 2;
}
