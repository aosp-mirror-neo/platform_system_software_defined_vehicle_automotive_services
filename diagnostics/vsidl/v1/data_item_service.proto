syntax = "proto3";

package com.android.sdv.diagnostics.data_item;

import "response_code.proto";

// Diagnostic interface that allows to read and write the data item.
//
// Corresponds to WriteDataByIdentifier (UDS 0x2E) and ReadDataByIdentifier (UDS 0x22)
// services.
//
// See ISO 14229-1:2020, sections 11.2, 11.7.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 11.2.4, 11.2.7 and "response_code.proto".
service DataItemService {
  // Read the data item by identifier.
  //
  // Corresponds to ReadDataByIdentifier UDS service.
  rpc ReadDataItem(ReadDataItemRequest) returns (ReadDataItemResponse) {}

  // Write the data item by identifier.
  //
  // Corresponds to WriteDataByIdentifier UDS service.
  rpc WriteDataItem(WriteDataItemRequest) returns (WriteDataItemResponse) {}
}

message ReadDataItemRequest {
  // Required. Id of data item.
  //
  // Data item id is scoped to the Service Instance that registers DataItemService server.
  string id = 1;
}

message ReadDataItemResponse {
  // Required. Data item value.
  bytes value = 1;

  // Response code.
  //
  // If not set, request was successful.
  ResponseCode response_code = 2;
}

message WriteDataItemRequest {
  // Required. Id of data item.
  //
  // Data item id is scoped to the Service Instance that registers DataItemService server.
  string id = 1;

  // Required. New data item value.
  bytes value = 2;
}

message WriteDataItemResponse {
  // Response code.
  //
  // If not set, request was successful.
  ResponseCode response_code = 1;
}
