syntax = "proto3";

package com.sdv.google.diagnostics.security_access;

import "connection.proto";
import "response_code.proto";

// Diagnostic interface for the SecurityAccess (UDS 0x27) service.
//
// Allows to unlock access to the diagnostic data and/or services, that have restricted access
// for security reasons.
//
// Typical use of the service is as follows:
// - client tries to access protected data via e.g. UDS 0x22 ReadDataByIdentifier
// - client receives ResponseCode::SECURITY_ACCESS_DENIED, identifying that data id is secured and
// not in unlocked state
// - client communicates via SecurityAccess service to unlock the secured data.
// - client requests the "seed" from the server.
// - client sends the "key" corresponding to the received "seed".
// - server validates the "key" and unlocks protected diagnostic data and/or services.
// - client now can access previously locked data identifier.
//
// See ISO 14229-1:2020, section 10.4.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 10.4.4 and "response_code.proto".
service SecurityAccessService {
  // Requests seed corresponding to the security access type provided in request.
  rpc RequestSeed(SeedRequest) returns (SeedResponse) {}

  // Sends key to unlock diagnostics data and/or services.
  rpc SendKey(SendKeyRequest) returns (SendKeyResponse) {}
}

message SeedRequest {
  // Required. Diagnostic connection id.
  ConnectionId connection_id = 1;

  // Required. Security access type for which the seed is being requested.
  //
  // Values: from 0x01 to 0x21, corresponding to SubFunction values 0x01, 0x03, ..., 0x41,
  // as defined in ISO 14229-1:2020, section 10.4.2.2.
  int32 security_access_type = 2;

  // Additional optional OEM-specific data, sent to the server while requesting the seed.
  bytes security_access_data_record = 3;
}

message SeedResponse {
  // Required. Seed value, to be used by the client for calculation of the key needed to access
  // protected diagnostic data and/or services.
  bytes seed = 1;

  // Response code.
  //
  // If not set, request was successful.
  ResponseCode response_code = 2;
}

message SendKeyRequest {
  // Required. Diagnostic connection id.
  ConnectionId connection_id = 1;

  // Required. Security access type for which the key is being sent.
  //
  // Values: from 0x01 to 0x21, corresponding to SubFunction values 0x02, 0x04, ..., 0x42,
  // as defined in ISO 14229-1:2020, section 10.4.2.2.
  int32 security_access_type = 2;

  // Required. The key generated by the security algorithm corresponding to a specific seed value.
  bytes key = 3;
}

message SendKeyResponse {
  // Response code.
  //
  // If not set, request was successful.
  ResponseCode response_code = 1;
}
