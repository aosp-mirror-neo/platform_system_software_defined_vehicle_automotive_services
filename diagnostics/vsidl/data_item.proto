syntax = "proto3";

package sdv.diagnostics.data_item;

import "google/protobuf/empty.proto";

// Diagnostic interface that allows to read and write data item by identifier.
//
// Corresponds to WriteDataByIdentifier (UDS 0x2E) and ReadDataByIdentifier (UDS 0x22)
// services.
//
// See ISO 14229-1:2020, sections 11.2, 11.7.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 11.2.4, 11.2.7.
service DataItemService {
  // Read data item by identifier.
  //
  // Corresponds to ReadDataByIdentifier UDS service.
  rpc Read(ReadRequest) returns (ReadResponse) {}

  // Write data item by identifier.
  //
  // Corresponds to WriteDataByIdentifier UDS service.
  rpc Write(WriteRequest) returns (google.protobuf.Empty) {}
}

message ReadRequest {
  // Unique id of data item.
  string id = 1;
}

message ReadResponse {
  // Data item value.
  bytes value = 1;
}

message WriteRequest {
  // Unique id of data item.
  string id = 1;

  // New data item value.
  bytes value = 2;
}
