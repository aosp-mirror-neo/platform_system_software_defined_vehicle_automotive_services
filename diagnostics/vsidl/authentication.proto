syntax = "proto3";

package sdv.diagnostics.authentication;

import "connection.proto";

// Diagnostic interface for the Authentication (UDS 0x29) service.
//
// See ISO 14229-1:2020, section 10.6.
//
// ** Common error codes **
// See ISO 14229-1:2020, section 10.6.4.
service Authentication {
  // Request to leave the authenticated state.
  rpc DeAuthenticate(connection.ConnectionId) returns (AuthenticationResponse) {}

  // Initiate authentication by verifying the certificate.
  rpc VerifyCertificate(VerifyCertificateRequest) returns (VerifyCertificateResponse) {}

  // Initiate authentication by verifying the certificate and generating a proof of
  // ownership from the server.
  rpc VerifyCertificateBidirectional(VerifyCertificateRequest)
      returns (VerifyCertificateBidirectionalResponse) {}

  // Verify the Proof of Ownership from the client.
  rpc ProofOfOwnership(ProofOfOwnershipRequest) returns (ProofOfOwnershipResponse) {}

  // Transfer the certificate for further processing.
  rpc TransmitCertificate(TransmitCertificateRequest) returns (AuthenticationResponse) {}

  // Initiate the Authentication process by requesting server to output a challenge.
  rpc RequestChallengeForAuthentication(RequestChallengeRequest)
      returns (RequestChallengeResponse) {}

  // Request server to verify the client side Proof of Ownership for unidirectional
  // authentication.
  rpc VerifyProofOfOwnership(VerifyProofOfOwnershipRequest)
      returns (VerifyProofOfOwnershipResponse) {}

  // Request server to verify the client side Proof of Ownership and provide server-side
  // Proof of Ownership for bidirectional authentication.
  rpc VerifyProofOfOwnershipBidirectional(VerifyProofOfOwnershipRequest)
      returns (VerifyProofOfOwnershipBidirectionalResponse) {}

  // Indicates the provided authentication configuration of the server.
  rpc AuthenticationConfiguration(connection.ConnectionId) returns (AuthenticationResponse) {}
}

enum ResponseCodes {
  // Request was successful.
  REQUEST_ACCEPTED = 0x00;

  // Request was not successful.
  GENERAL_REJECTED = 0x01;

  // Indicates the provided authentication configuration as Authentication with PKI
  // Certificate Exchange (APCE).
  APCE_CONFIGURATION = 0x02;

  // Indicates the provided authentication configuration as Authentication with
  // Challenge-Response (ACR) and asymmetric cryptography.
  ACR_ASYMMETRIC_CONFIGURATION = 0x03;

  // Indicates the provided authentication configuration as Authentication with
  // Challenge-Response (ACR) and symmetric cryptography.
  ACR_SYMMETRIC_CONFIGURATION = 0x04;

  // Deauthentication was successful, server is protected again.
  DEAUTHENTICATION_SUCCESSFUL = 0x10;

  // Certificate could be verified in first step, second step is pending.
  CERTIFICATE_VERIFIED_OWNERSHIP_VERIFICATION_NECESSARY = 0x11;

  // Proof of ownership could be verified, authentication is complete.
  OWNERSHIP_VERIFIED_AUTH_COMPLETE = 0x12;

  // Certificate could be verified.
  CERTIFICATE_VERIFIED = 0x13;

  // 0x14 to 0x9F: Reserved.
  // 0xA0 to 0xCF: Vehicle manufacturer specific.
  // 0xD0 to 0xFE: System supplier specific.
  // 0xFF: Reserved.
}

message AuthenticationResponse {
  // Authentication response code, see ResponseCodes enum.
  //
  // The field allows to use vehicle / system supplier specific values. Thus, the field is
  // a generic int32, rather that an enum.
  int32 response_code = 1;
}

message VerifyCertificateRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // Certificate to verify.
  //
  // Format of this parameter is OEM-specific.
  bytes certificate = 2;

  // A challenge that contains formatted client data or is a random number. Null if not
  // needed for proof of ownership verification.
  //
  // Format of this parameter is OEM-specific.
  bytes challenge = 3;
}

message VerifyCertificateResponse {
  // See AuthenticationResponse.
  AuthenticationResponse response = 1;

  // A challenge contains vehicle manufacturer specific formatted server data or is a
  // random number.
  //
  // Format of this field is OEM-specific.
  bytes challenge = 2;

  // Ephemeral public key generated by the server for Diffie-Hellman key agreement.
  //
  // Non-null only when using Diffie-Hellman key agreement for secure diagnostic
  // communication.
  bytes ephemeral_public_key = 3;
}

message VerifyCertificateBidirectionalResponse {
  // See AuthenticationResponse.
  AuthenticationResponse response = 1;

  // The challenge contains vehicle manufacturer specific formatted server data or is a
  // random number.
  //
  // Format of this field is OEM-specific.
  bytes challenge = 2;

  // A certificate to verify.
  //
  // Format of this field is OEM-specific.
  bytes certificate = 3;

  // Proof of ownership to be verified by the client.
  //
  // Format of this field is OEM-specific.
  bytes proof_of_ownership = 4;

  // Ephemeral public key generated by the server for Diffie-Hellman key agreement.
  //
  // Non-null only when using Diffie-Hellman key agreement for secure diagnostic
  // communication.
  bytes ephemeral_public_key = 5;
}

message ProofOfOwnershipRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // Proof of ownership of the previous given challenge to be verified by the server.
  bytes proof_of_ownership = 2;

  // A key generated by the client for Diffie-Hellman key agreement.
  //
  // Non-null only when using Diffie-Hellman key agreement for
  // secure diagnostic communication.
  bytes ephemeral_public_key = 3;
}

message ProofOfOwnershipResponse {
  // See AuthenticationResponse.
  int32 authentication_response = 1;

  // This value shall contain session key information, e.g. the encrypted session key(s)
  // for securing further communication in the actual session and/or proof value(s)
  // (e.g. a hash value) for the validation of the session key(s) on the client side.
  //
  // Non-null if secure diagnostics communication is in use.
  //
  // Format of this field is OEM-specific.
  bytes session_key_info = 2;
}

message TransmitCertificateRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // A unique id to identify the evaluation type of the transmitted certificate.
  int32 certificate_evaluation_id = 2;

  // A certificate to verify.
  //
  // Format of this field is OEM-specific.
  bytes certificate = 3;
}

message RequestChallengeRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // Configuration information about how to proceed with security in further diagnostic
  // communication after the authentication.
  int32 communication_configuration = 2;

  // Indicates the algorithm used in the generating and verifying proof of ownership.
  bytes algorithm_indicator = 3;
}

message RequestChallengeResponse {
  // See AuthenticationResponse.
  AuthenticationResponse response = 1;

  // Indicates the algorithm used in the generating and verifying proof of ownership.
  bytes algorithm_indicator = 2;

  // The challenge contains vehicle manufacturer specific formatted server data or is a
  // random number.
  //
  // Format of this field is OEM-specific.
  bytes challenge = 3;

  // Indicate what additional parameters, if needed, are expected by the server.
  //
  // Format of this field is OEM-specific.
  bytes needed_additional_parameter = 4;
}

message VerifyProofOfOwnershipRequest {
  // Diagnostic connection id.
  connection.ConnectionId connection_id = 1;

  // Indicates the algorithm used in the generating and verifying proof of ownership.
  bytes algorithm_indicator = 2;

  // Proof of ownership of the previous given challenge to be verified by the server.
  //
  // Format of this parameter is OEM-specific.
  bytes proof_of_ownership = 3;

  // A challenge that contains formatted client data or is a random number. Null if not
  // needed for proof of ownership verification.
  //
  // Format of this parameter is OEM-specific.
  bytes challenge = 4;

  // Additional parameter provided to the server if the server indicates the need for such
  // parameter in RequestChallengeResponse.
  //
  // Format of this parameter is OEM-specific.
  bytes additional_parameter = 5;
}

message VerifyProofOfOwnershipResponse {
  // See AuthenticationResponse.
  AuthenticationResponse response = 1;

  // Indicates the algorithm used in the generating and verifying proof of ownership.
  bytes algorithm_indicator = 2;

  // This value shall contain session key information, e.g. the encrypted session key(s)
  // for securing further communication in the actual session and/or proof value(s)
  // (e.g. a hash value) for the validation of the session key(s) on the client side.
  //
  // Non-null if secure diagnostics communication is in use.
  //
  // Format of this field is OEM-specific.
  bytes session_key_info = 3;
}

message VerifyProofOfOwnershipBidirectionalResponse {
  // See AuthenticationResponse.
  AuthenticationResponse response = 1;

  // Indicates the algorithm used in the generating and verifying proof of ownership.
  bytes algorithm_indicator = 2;

  // Proof of ownership to be verified by the client.
  //
  // Format of this field is OEM-specific.
  bytes proof_of_ownership = 3;

  // This value shall contain session key information, e.g. the encrypted session key(s)
  // for securing further communication in the actual session and/or proof value(s)
  // (e.g. a hash value) for the validation of the session key(s) on the client side.
  //
  // Non-null if secure diagnostics communication is in use.
  //
  // Format of this field is OEM-specific.
  bytes session_key_info = 4;
}
