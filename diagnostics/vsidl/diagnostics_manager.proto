syntax = "proto3";

package sdv.diagnostics.manager;

import "connection.proto";
import "negative_response_code.proto";

// Diagnostics RPC API available to SDV services.
//
// Based on ISO 14229-1:2020. See README for external links.
//
// These APIs are experimental at this point.
service DiagnosticsManager {
  // Get connection metadata by its id.
  //
  // Allows diagnostic services to query the metadata of the current connection.
  // Connection id is provided as a parameter on every method of the following diagnostic
  // services:
  // - AuthenticationService
  // - FileTransferService
  // - ECUResetService
  // - SecurityAccessHandler
  rpc GetConnectionMetadata(GetConnectionMetadataRequest) returns (GetConnectionMetadataResponse) {}
}

message GetConnectionMetadataRequest {
  // id of the connection which metadata is being queried.
  connection.ConnectionId id = 1;
}

// Metadata of the underlying diagnostics connection.
//
// This data is retrieved from the UDS payload that triggered a service call.
message GetConnectionMetadataResponse {
  connection.ConnectionMetadata metadata = 1;
  // Error code.
  //
  // If set to a value other than "POSITIVE_RESPONSE" indicates an error handling the request.
  // Other parts of response should be ignored in such case.
  nrc.NegativeResponseCode error_code = 2;
}
